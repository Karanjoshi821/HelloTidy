# Who may connect, and how. First matching line wins.
#
# - The postgres superuser only works from inside the container (Unix socket,
#   OS user postgres). It can never log in over the network.
# - Over the network, each app user reaches only its own database, only over
#   TLS, only with a SCRAM password. Everything else is rejected.

# TYPE  DATABASE        USER            ADDRESS         METHOD
local   all             postgres                        peer
local   all             all                             scram-sha-256

hostssl hellotidy_live  hellotidy_live  0.0.0.0/0       scram-sha-256
hostssl hellotidy_live  hellotidy_live  ::/0            scram-sha-256
hostssl hellotidy_test  hellotidy_test  0.0.0.0/0       scram-sha-256
hostssl hellotidy_test  hellotidy_test  ::/0            scram-sha-256

host    all             all             0.0.0.0/0       reject
host    all             all             ::/0            reject
